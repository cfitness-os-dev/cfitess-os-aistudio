# ==============================================================================
# C.FITNESS OS — Stack unifiée Linux Debian 12 (Bi-club + Module RH V1.16)
# ==============================================================================
name: cfitness-os

services:
  cfitness-os:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    container_name: cfitness-os
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: Europe/Paris
      PORT: ${PORT:-8080}
      CFITNESS_BIND_ADDR: 0.0.0.0:8080
      CFITNESS_DATA_DIR: /var/lib/cfitness
      CFITNESS_FRONTEND_DIR: /app/dist
      STATIC_DIR: /app/dist
      RUST_LOG: ${RUST_LOG:-info,cfitness_os=debug}
      # Authentification serveur (CFOS-056 / CFOS-026) : session Bearer obligatoire hors mode démo
      CFITNESS_STRICT_SESSION: ${CFITNESS_STRICT_SESSION:-0}
      CFITNESS_DEMO_MODE: ${CFITNESS_DEMO_MODE:-1}
      CFITNESS_INITIAL_ADMIN_ID: ${CFITNESS_INITIAL_ADMIN_ID:-emp-mario}
      CFITNESS_INITIAL_ADMIN_PASSWORD: ${CFITNESS_INITIAL_ADMIN_PASSWORD:-}
      CFITNESS_INITIAL_ADMIN_EMAIL: ${CFITNESS_INITIAL_ADMIN_EMAIL:-direction@c.fitness}
      CFITNESS_INITIAL_ADMIN_FIRST_NAME: ${CFITNESS_INITIAL_ADMIN_FIRST_NAME:-Direction}
      CFITNESS_INITIAL_ADMIN_LAST_NAME: ${CFITNESS_INITIAL_ADMIN_LAST_NAME:-C.Fitness}
      # Intégrations provider & webhooks signés (Stripe HMAC, Lead, Heitz, CORS)
      CFITNESS_STRIPE_WEBHOOK_SECRET: ${CFITNESS_STRIPE_WEBHOOK_SECRET:-}
      CFITNESS_STRIPE_TOLERANCE_SECONDS: ${CFITNESS_STRIPE_TOLERANCE_SECONDS:-300}
      CFITNESS_LEAD_API_KEY: ${CFITNESS_LEAD_API_KEY:-}
      CFITNESS_INBOUND_WEBHOOK_SECRET: ${CFITNESS_INBOUND_WEBHOOK_SECRET:-}
      CFITNESS_HEITZ_WEBHOOK_SECRET: ${CFITNESS_HEITZ_WEBHOOK_SECRET:-}
      CFITNESS_WEBHOOK_TOLERANCE_SECONDS: ${CFITNESS_WEBHOOK_TOLERANCE_SECONDS:-300}
      CFITNESS_AUTOMATION_SCHEDULER: ${CFITNESS_AUTOMATION_SCHEDULER:-1}
      CFITNESS_AUTOMATION_INTERVAL_SECS: ${CFITNESS_AUTOMATION_INTERVAL_SECS:-900}
      CFITNESS_ALLOWED_ORIGINS: ${CFITNESS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://192.168.1.120:8080}
      CFITNESS_BACKUP_SIGNING_KEY: ${CFITNESS_BACKUP_SIGNING_KEY:-}
      CFITNESS_TRUST_PROXY: ${CFITNESS_TRUST_PROXY:-0}
      CFITNESS_COOKIE_SECURE: ${CFITNESS_COOKIE_SECURE:-0}
      # Passerelle API Heitz-WS / Cloud HeitzSystem (ID centers 3845 Carré de Soie / 4967 Beynost) & liens web vérifiés
      HEITZ_WS_URL: ${HEITZ_WS_URL:-https://fitness.cf.cloud0302.heitzsystem.com}
      HEITZ_DEV_ID: ${HEITZ_DEV_ID:-}
      HEITZ_DEV_KEY: ${HEITZ_DEV_KEY:-}
      HEITZ_CENTER_ID_CDS: ${HEITZ_CENTER_ID_CDS:-3845}
      HEITZ_CENTER_ID_BEY: ${HEITZ_CENTER_ID_BEY:-4967}
      HEITZ_WS_TOKEN: ${HEITZ_WS_TOKEN:-}
      CFITNESS_HEITZ_LIVE_READS_ENABLED: ${CFITNESS_HEITZ_LIVE_READS_ENABLED:-0}
      CFITNESS_HEITZ_LOOPBACK_TESTS: "0"
      CFITNESS_HEITZ_WEB_URL_CDS: ${CFITNESS_HEITZ_WEB_URL_CDS:-}
      CFITNESS_HEITZ_WEB_URL_BEY: ${CFITNESS_HEITZ_WEB_URL_BEY:-}
      # Contrôleurs relais IP Modbus TCP portillons Gunnebo / Axess
      TURNSTILE_MODBUS_RELAY_CDS: ${TURNSTILE_MODBUS_RELAY_CDS:-10.10.0.21:502}
      TURNSTILE_MODBUS_RELAY_BEY: ${TURNSTILE_MODBUS_RELAY_BEY:-10.20.0.21:502}
      # Téléphonie ARCEP n° 2022-1583 : fixes 04 OVHcloud + mobiles 07 Yeastar TG400
      SIP_TRUNK_PROVIDER: ${SIP_TRUNK_PROVIDER:-ovhcloud_sip}
      OVH_SIP_TRUNK_HOST: ${OVH_SIP_TRUNK_HOST:-sip.ovh.fr}
      YEASTAR_TG400_SIP_GATEWAY: ${YEASTAR_TG400_SIP_GATEWAY:-10.10.0.14:5060}
      # Ingestion locale CSV Lookin'Body 120, canal recrutement ATS & réplication
      INBODY_LB120_CSV_DROP_DIR: /var/inbody-lb120-drop
      ATS_INBOUND_EMAIL: ${ATS_INBOUND_EMAIL:-recrutement@c.fitness}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:3b}
      BACKUP_REPLICA_DIR: /var/backups/cfitness-os
      BACKUP_SECONDARY_NODES: ${BACKUP_SECONDARY_NODES:-10.20.0.15,10.10.0.12,10.10.0.31,10.20.0.31}
    volumes:
      - cfitness_data:/var/lib/cfitness
      - cfitness_backups:/var/backups/cfitness-os
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "heitz-windows-vm.local:10.10.0.20"
      - "yeastar-tg400-gsm.local:10.10.0.14"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cfitness_data:
  cfitness_backups:
